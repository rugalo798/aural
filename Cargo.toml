[package]
name = "aural"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "x11", "wayland", "default_fonts"] }
egui = "0.37.0"
image = "0.25.10"
lofty = "0.25.5"
md5 = "0.8.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "charset", "http2", "rustls"] }
rodio = "0.23.0"
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
souvlaki = "0.8.3"
toml = "1.1.8"
walkdir = "2.5.0"
